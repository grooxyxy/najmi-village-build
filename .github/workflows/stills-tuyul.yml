name: Tuyul stills

on:
  workflow_dispatch:
  repository_dispatch:
    types: [tuyul-stills]

permissions:
  contents: read

jobs:
  stills:
    name: Render 5 validation stills
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TMP: /home/runner/work/_temp/remotion
      TEMP: /home/runner/work/_temp/remotion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Render stills
        run: |
          mkdir -p out/stills "$TMP"
          for f in 120 900 2100 3400 4600; do
            npx remotion still src/index.ts TuyulShort "out/stills/f${f}.png" \
              --frame=$f --gl=swangle --overwrite
          done

      - name: Upload stills
        uses: actions/upload-artifact@v4
        with:
          name: tuyul-stills
          path: out/stills
          retention-days: 7
