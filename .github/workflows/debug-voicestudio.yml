name: Debug VoiceStudio packages

on:
  workflow_dispatch:

jobs:
  debug:
    name: Inspect OmniVoice imports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pull VoiceStudio image
        run: docker pull ghcr.io/debpalash/voicestudio:stable

      - name: Inspect Python packages and imports
        run: |
          set -x
          docker run -d --name vs-debug --entrypoint sleep \
            -e PYTHONPATH=/app/backend \
            ghcr.io/debpalash/voicestudio:stable 600
          docker exec -i vs-debug /opt/conda/bin/python3 - <<'PY'
          import sys, traceback
          print('python', sys.version)
          for name in ('transformers', 'torch', 'torchvision', 'torchaudio', 'omnivoice'):
              try:
                  m = __import__(name)
                  print(name, getattr(m, '__version__', '?'), getattr(m, '__file__', '?'))
              except Exception:
                  print(name, 'IMPORT FAILED')
                  traceback.print_exc()
          try:
              from transformers import AutoFeatureExtractor
              print('top-level AutoFeatureExtractor OK', AutoFeatureExtractor)
          except Exception:
              print('top-level AutoFeatureExtractor FAILED')
              traceback.print_exc()
          try:
              from transformers.models.auto import AutoFeatureExtractor as AFE
              print('submodule AutoFeatureExtractor OK', AFE)
          except Exception:
              print('submodule AutoFeatureExtractor FAILED')
              traceback.print_exc()
          try:
              import omnivoice.models.omnivoice as omni
              print('omnivoice import OK', omni)
          except Exception:
              print('omnivoice import FAILED')
              traceback.print_exc()
          PY

      - name: Patch OmniVoice import and verify
        run: |
          set -euo pipefail
          docker exec -i vs-debug /opt/conda/bin/python3 - <<'PY'
          from pathlib import Path
          path = Path('/app/omnivoice/models/omnivoice.py')
          source = path.read_text()
          needle = 'from transformers import (\n    AutoFeatureExtractor,\n'
          if 'from transformers.models.auto import AutoFeatureExtractor' not in source:
              if needle not in source:
                  raise SystemExit('OmniVoice import block not found')
              source = source.replace(
                  needle,
                  'from transformers.models.auto import AutoFeatureExtractor\nfrom transformers import (\n',
                  1,
              )
              path.write_text(source)
              print('patched', path)
          else:
              print('already patched', path)
          PY
          docker exec -i vs-debug /opt/conda/bin/python3 - <<'PY'
          import traceback
          try:
              import omnivoice.models.omnivoice as omni
              print('patched omnivoice import OK', omni)
          except Exception:
              print('patched omnivoice import FAILED')
              traceback.print_exc()
              raise
          PY
