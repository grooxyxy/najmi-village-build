name: Preview Episode 02 stills

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Preview Episode 02 stills
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          for attempt in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true update || true
            if sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true install -y --no-install-recommends fonts-dejavu-core libgomp1; then
              exit 0
            fi
            echo "apt-get failed (attempt ${attempt}/5), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Install Python image tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Generate pixel sprites
        run: python3 scripts/generate-sprites.py

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render Episode 02 preview stills
        run: |
          mkdir -p out
          npx remotion still src/index.ts NajmiEp2 out/ep2-s1-cabin.png --frame=150 --gl=swangle
          npx remotion still src/index.ts NajmiEp2 out/ep2-s3-store.png --frame=2550 --gl=swangle
          npx remotion still src/index.ts NajmiEp2 out/ep2-s6-forest.png --frame=5500 --gl=swangle
          npx remotion still src/index.ts NajmiEp2 out/ep2-s6-forest-last.png --frame=5699 --gl=swangle

      - name: Upload Episode 02 preview stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: najmi-episode-02-preview-stills
          path: out/ep2-*.png
          if-no-files-found: warn
          retention-days: 14
